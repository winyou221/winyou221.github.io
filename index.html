<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>김승유 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

    <main class="container">

        <!-- 프로필 카드 -->
        <section class="profile-card">

            <div class="avatar">
                김
            </div>

            <div>
                <h2>김승유</h2>
                <p>ICT 자율전공</p>

                <p>
                    안녕하세요. 저는 21살 김승유입니다.
                    꼼꼼한 성격을 가지고 있으며 새로운 기술을 배우는 것을 좋아합니다.
                    꾸준히 성장하는 개발자가 되는 것이 목표입니다.
                </p>

                <div class="info-grid">
                    <div>
                        <strong>나이</strong><br>
                        21살
                    </div>
                    <div>
                        <strong>전공</strong><br>
                        ICT 자율전공
                    </div>
                    <div>
                        <strong>취미</strong><br>
                        영화보기
                    </div>
                    <div>
                        <strong>특기</strong><br>
                        수학
                    </div>
                </div>

            </div>

        </section>

        <!-- About Me -->
        <section class="section-card">
            <h3>About Me</h3>
            <p>
                저는 꼼꼼하고 책임감 있는 성격을 가지고 있습니다.
                새로운 기술을 배우는 과정을 즐기며,
                배운 내용을 직접 적용해보는 것을 좋아합니다.
                앞으로도 다양한 분야의 기술을 익히며 꾸준히 성장하고 싶습니다.
            </p>
        </section>

    </main>

</div>

</html>
